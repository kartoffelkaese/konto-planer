name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://test:test@127.0.0.1:3306/konto_planer_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Blockierend: alles, was auf dem Server läuft
      - run: npm run audit:check

      # Nur zur Information: Entwicklungswerkzeuge (ESLint, Tests) – bricht den Lauf nicht ab
      - name: npm audit (inkl. Entwicklungswerkzeuge)
        run: npm run audit:all
        continue-on-error: true

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
